name: Personal macOS Claude subscription build (Intel cross-compile)

on:
  push:
    branches: [personal/claude-subscription-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Apple Silicon app
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      BUZZ_UPDATER_PUBLIC_KEY: ""
      BUZZ_UPDATER_ENDPOINT: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify architecture and runner space
        run: |
          test "$(uname -m)" = x86_64
          df -h "$GITHUB_WORKSPACE"
      - name: Read repository tool versions
        id: pins
        run: |
          python3 - <<'PINS'
          import os, pathlib, re, tomllib
          values = {name: next(pathlib.Path('bin').glob(f'.{name}-*.pkg')).name.removeprefix(f'.{name}-').removesuffix('.pkg') for name in ['node', 'pnpm', 'cmake']}
          values['rust'] = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PINS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - name: Install pinned compiler, cross target and CMake
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
          CMAKE_VERSION: ${{ steps.pins.outputs.cmake }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          archive="cmake-${CMAKE_VERSION}-macos-universal.tar.gz"
          base="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O "$base/$archive"
          curl --fail --location --retry 3 -o cmake-checksums.txt "$base/cmake-${CMAKE_VERSION}-SHA-256.txt"
          grep "  $archive$" cmake-checksums.txt > cmake-selected.sha256
          test -s cmake-selected.sha256
          shasum -a 256 -c cmake-selected.sha256
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/cmake-${CMAKE_VERSION}-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: personal-macos-intel-to-arm64
          cache-on-failure: true
      - name: Check formatting, types and design contracts
        run: pnpm check
      - name: Test authentication and agent configuration
        run: pnpm exec vitest run src/bundled/claude-code src/features/agents src/features/relay/session-snapshot-read.test.ts
      - name: Configure personal build without official updater
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const base = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version.split('-')[0];
          const version = `${base}-claude.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
          writeFileSync(`${process.env.RUNNER_TEMP}/personal.json`, JSON.stringify({
            version,
            bundle: { createUpdaterArtifacts: false, macOS: { signingIdentity: '-' } }
          }));
          JS
      - name: Build ad-hoc signed Apple Silicon application
        run: pnpm tauri build --ci --bundles app --target aarch64-apple-darwin --config "$RUNNER_TEMP/personal.json" -- --locked
      - name: Verify bundle and prepare download
        run: |
          set -euo pipefail
          app=target/aarch64-apple-darwin/release/bundle/macos/Buzz.app
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Buzz")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          for helper in buzz buzz-agent-command goose-acp; do
            test -x "$app/Contents/Resources/bin/$helper"
            test "$(lipo -archs "$app/Contents/Resources/bin/$helper")" = arm64
          done
          # The arm64 helpers are verified here; execute them only on the destination Mac.
          mkdir personal-artifact
          ditto -c -k --sequesterRsrc --keepParent "$app" personal-artifact/Buzz-Claude-Subscription-Apple-Silicon.zip
          cp docs/personal-build.md personal-artifact/READ-ME-FIRST.md
          printf '%s\n' "$GITHUB_SHA" > personal-artifact/SOURCE_COMMIT
          printf '%s\n' 'https://github.com/block/buzz-app/pull/2995' 'upstream patch: 23a7fbdbc42e70c98fb39373cb57040470bd486f' > personal-artifact/PATCH_SOURCE
          (cd personal-artifact && shasum -a 256 Buzz-Claude-Subscription-Apple-Silicon.zip > SHA256SUMS)
          du -sh "$app" personal-artifact
          {
            echo '### Personal Buzz build'
            echo 'Apple Silicon; ad-hoc signed; not Apple notarized; not an official Buzz release.'
            echo "Source commit: $GITHUB_SHA"
            echo 'Authentication tests and native build passed. Real Claude/ChatGPT login and UI acceptance must be tested on the destination Mac.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Buzz-Claude-Subscription-Apple-Silicon
          path: personal-artifact/
          if-no-files-found: error
          retention-days: 7
